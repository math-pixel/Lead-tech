name: publish
on:
    push:
        branches: [develop]
    workflow_dispatch:
        
jobs:
    publish-staging-image:
        name: Build staging image
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
            permissions:
              contents: read
              packages: write
      tags: ${{ inputs.deploy_target }}:staging

run : |
    docker build . --tag ghcr.io/deselikem/hello-docker-gcr-demo:staging
    docker push ghcr.io/deselikem/hello-docker-gcr-demo:staging
