name: publish
on: [push]
jobs:
publish-hello-docker-image:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v2
- name: Login to GitHub Container Registry
uses: docker/login-action@v1
with:
registry: ghcr.io
username: ${{ github.actor }}
password: ${{ secrets.GITHUB_TOKEN }}
- name: Build the hello-docker Docker image

# run: |
#        docker build . --tag ghcr.io/deselikem/hello-docker-gcr-demo:latest
#        docker run ghcr.io/deselikem/hello-docker-gcr-demo:latest

# Source - https://stackoverflow.com/a/76610067
# Posted by Dolphin
# Retrieved 2026-08-31, License - CC BY-SA 4.0

build_and_push:
    name: Build image & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    with:
      tags: ${{ inputs.deploy_target }}:staging
